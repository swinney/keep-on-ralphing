# Worked example: ralph.conf for the "Acme Widgets" sample (a Python library).
# Compare against ../ralph.conf.example (the blank, fully-commented version).
# The container name, workspace, and toolchain here agree with the sibling
# example PROMPT.md / Containerfile / Makefile.

RALPH_WORKSPACE="/workspace"
RALPH_TASKS="tasks.md"
RALPH_STATE_DIR=".ralph"

RALPH_MODEL="claude-sonnet-4-6"
RALPH_TURN_TIMEOUT="1200"
RALPH_MAX_STALLS="2"
RALPH_LIMIT_POLL="900"
RALPH_POLL_INTERVAL="30"

# Outer-loop review gate — ON by default (this loop is GitHub-dependent). Acme has
# a remote + authenticated `gh`, and the loop runs on a feature branch, so it just
# works. Set RALPH_REVIEW_GATE=0 only to run the offline inner loop with no review.
# See ../ralph.conf.example for the full key documentation.
RALPH_REVIEW_GATE="1"
RALPH_AUTO_MERGE="0"
RALPH_REVIEW_MAX_ROUNDS="3"
RALPH_BASE_BRANCH=""
RALPH_REVIEWER=""

RALPH_CONTAINER="acme-loop"
RALPH_RUNTIME="podman"
