# Worked example: ralph.conf for the "Acme Widgets" sample (a Python library).
# Compare against ../ralph.conf.example (the blank, fully-commented version).
# The container name, workspace, and toolchain here agree with the sibling
# example PROMPT.md / Containerfile / Makefile.

RALPH_WORKSPACE="/workspace"
RALPH_TASKS="tasks.md"
RALPH_STATE_DIR=".ralph"

RALPH_MODEL="claude-sonnet-4-6"

# Work-class model dispatch (optional cost dial). Acme runs sonnet for everything
# by default; to spend a stronger model on stateful work, tag those tasks in
# tasks.md with a trailing "(stateful)" and uncomment the key below. Untagged
# tasks keep using RALPH_MODEL. See ../ralph.conf.example for the full key docs.
# RALPH_MODEL_STATEFUL="claude-opus-4-8"   # for tasks tagged (stateful)

RALPH_TURN_TIMEOUT="1200"
RALPH_MAX_STALLS="2"
RALPH_LIMIT_POLL="900"
RALPH_POLL_INTERVAL="30"

# Aggregate log for an external aggregator (one tail target: narration + agent
# output, turn-prefixed). On by default; see ../ralph.conf.example and
# ../docs/recipes/vector-console.md. Set 0 to reproduce the pre-feature files.
RALPH_LIVE_LOG="1"

# Outer-loop review gate — ON by default (this loop is GitHub-dependent). Acme has
# a remote + authenticated `gh`, and the loop runs on a feature branch, so it just
# works. Set RALPH_REVIEW_GATE=0 only to run the offline inner loop with no review.
# See ../ralph.conf.example for the full key documentation.
RALPH_REVIEW_GATE="1"
RALPH_AUTO_MERGE="0"
RALPH_REVIEW_MAX_ROUNDS="3"
RALPH_BASE_BRANCH=""
RALPH_REVIEWER=""

# Outbound notification — opt-in, off here. Acme runs attended, so it leaves the
# notifier empty; to ping Slack when the loop needs a human, point RALPH_NOTIFY_CMD
# at a script (see ../docs/recipes/slack-notify.md). The blocked-question stop uses
# the default docs/questions.md. See ../ralph.conf.example for full key docs.
RALPH_NOTIFY_CMD=""
RALPH_NOTIFY_TIMEOUT="30"
RALPH_QUESTIONS="docs/questions.md"

RALPH_CONTAINER="acme-loop"
RALPH_RUNTIME="podman"
